name: Deploy site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # publish.yml deploys right after creating a release
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    # Renders the localized pages from src/ and locales/, and copies everything else as-is (see eleventy.config.js)
    - name: Build the site
      run: |
        npm ci
        npx @11ty/eleventy
        npm run i18n:check || echo "::warning::Some strings aren't translated and show in English; see the i18n:check output above"

    - name: Add the release files
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p _site/app
        if gh release view --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          # The release's latest.json replaces the placeholder in app/
          gh release download --repo "$GITHUB_REPOSITORY" --dir _site/app --clobber \
            --pattern 'LanBucket_*.msixbundle' --pattern 'LANBucketSetup_*.exe' --pattern 'latest.json'
        fi
        ls -l _site/app

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
